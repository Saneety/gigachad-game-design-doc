<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>Кукла героя</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a stage with the assembled doll on the left, its controls and layer list on the right,
   the frame strips of every layer full width below; one column on a phone. */
:root {
  --bg: #eceff2;
  --surface: #ffffff;
  --fg: #1c2127;
  --muted: #5a6471;
  --line: #d2d8df;
  --accent: #9a6c14;
  --accent-fg: #ffffff;
  --stage: #5d7148;
  --stage-line: rgba(255, 255, 255, 0.55);
  --font-body: "Golos Text", system-ui, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1c2127; --fg: #e7eaee; --muted: #98a2ae; --line: #2d343c;
    --accent: #e2a93f; --accent-fg: #1a1408; --stage: #46583a; --stage-line: rgba(255, 255, 255, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1c2127; --fg: #e7eaee; --muted: #98a2ae; --line: #2d343c;
  --accent: #e2a93f; --accent-fg: #1a1408; --stage: #46583a; --stage-line: rgba(255, 255, 255, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.page { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 40px; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 26px; font-weight: 600; margin: 0; text-wrap: balance; }
h2 { font-size: 13px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.lead { margin: 6px 0 0; color: var(--muted); max-width: 65ch; }
.work { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .work { grid-template-columns: minmax(0, 1fr); } }
.stage-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage { background: var(--stage); border-radius: 6px; overflow: hidden; display: flex; justify-content: center; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#stage { touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage.dragging { cursor: grabbing; }
.status { font-family: var(--font-data); font-size: 13px; color: var(--muted); min-height: 1.45em; }
.panel { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.group { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
input[type="range"] { flex: 1 1 140px; min-width: 0; accent-color: var(--accent); }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.num { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.layers { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.layers li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.layers li .note { grid-column: 1 / -1; padding-left: 26px; }
.layers label { display: flex; align-items: center; gap: 10px; min-width: 0; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.note { color: var(--muted); font-size: 13px; }
.strips { display: flex; flex-direction: column; gap: 14px; }
.strip-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.strip-name { font-weight: 600; }
.strip-scroll { overflow-x: auto; background: var(--stage); border-radius: 6px; }
.strip-scroll canvas { margin: 0; }
</style>

<div class="page">
  <header>
    <h1 id="title">Кукла героя</h1>
    <p class="lead" id="lead">Герой собран из пяти плоских слоев. У каждого слоя своя лента кадров, а в игре они лежат стопкой друг на друге. Тащи любой слой мышью, отключай слои и листай кадры.</p>
  </header>

  <div class="work">
    <div class="stage-wrap">
      <div class="stage" id="stageBox"><canvas id="stage" width="160" height="124" aria-label="Собранный герой, слои можно перетаскивать"></canvas></div>
      <div class="status" id="status"></div>
      <div class="row">
        <button id="play" type="button">Пауза</button>
        <input id="frame" type="range" min="0" max="7" step="1" value="0" aria-label="Кадр анимации">
        <span class="num" id="frameNum"></span>
      </div>
    </div>

    <div class="panel">
      <div class="group">
        <h2>Направление</h2>
        <div class="seg" id="dirs"></div>
        <div class="note" id="dirNote"></div>
      </div>
      <div class="group">
        <h2>Анимация</h2>
        <div class="seg" id="anims"></div>
      </div>
      <div class="group" id="palGroup">
        <h2>Палитра</h2>
        <div class="seg" id="pals"></div>
        <div class="note" id="palNote"></div>
      </div>
      <div class="group">
        <h2>Слои</h2>
        <ul class="layers" id="layers"></ul>
        <div class="row">
          <label for="spread">Разнести</label>
          <input id="spread" type="range" min="0" max="12" step="1" value="0">
          <span class="num" id="spreadNum">0 px</span>
        </div>
        <div class="row">
          <label class="row" for="frames"><input id="frames" type="checkbox"> Рамки кадров и точка привязки</label>
          <button id="reset" type="button">Собрать обратно</button>
        </div>
      </div>
    </div>
  </div>

  <section class="strips">
    <h2>Ленты кадров</h2>
    <div id="strips"></div>
  </section>
</div>

const DIRS = [["down", "Вниз"], ["left", "Влево"], ["up", "Вверх"], ["right", "Вправо"]];
const ANIMS = HERO.anims || [["idle", "Покой"], ["walk", "Ходьба"], ["interact", "Жест"], ["blink", "Моргание"]];
const HEAD_GROUP = HERO.headGroup || ["head", "crown", "face"];

const [CW, CH] = HERO.cell;

const state = {

  visible: Object.fromEntries(HERO.order.map(l => [l, true])),

const $ = id => document.getElementById(id);
const stage = $("stage"), sctx = stage.getContext("2d");

function loadImage(src) {
  return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; });
}

function toCanvas(im) {
  const c = document.createElement("canvas");
  c.width = im.width; c.height = im.height;
  c.getContext("2d").drawImage(im, 0, 0);
  return c;
}

// The strips are painted with key colours: ramp A = (k, 0, k), ramp B = (0, 0, k), k = 16 + 32 * shade.
// A palette swaps each ramp for 8 real shades, the same thing the game shader does.
function recolor(src, pal, set) {
  const c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext("2d");
  const img = src.getContext("2d").getImageData(0, 0, src.width, src.height);
  const d = img.data, p = pal.data, pw = pal.width;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2];
    let row = -1, k = 0;
    if (g === 0 && r === b && r > 0 && (r - 16) % 32 === 0) { row = set * 2; k = (r - 16) / 32; }
    else if (r === 0 && g === 0 && b > 0 && (b - 16) % 32 === 0) { row = set * 2 + 1; k = (b - 16) / 32; }

      d[i] = p[o]; d[i + 1] = p[o + 1]; d[i + 2] = p[o + 2];
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;

function animFrames() {
  const dir = state.dir === "right" ? "left" : state.dir;
  return HERO.animations[state.anim + "_" + dir].frames;
}

function layerFrame(fr, layer) {
  const i = fr[layer];
  return i === undefined || i === null ? -1 : i;
}

function layerPos(layer, fr) {
  const i = HERO.order.indexOf(layer);
  const baseX = Math.max(4, Math.floor((stage.width - CW) / 2) - 3 * state.spread);
  const baseY = 44;
  const dy = HEAD_GROUP.includes(layer) ? (fr.head_dy || 0) : 0;
  return {
    x: baseX + state.offset[layer].x + i * state.spread,
    y: baseY + state.offset[layer].y + dy - Math.round(i * state.spread * 0.6),

function strips() { return state.palette < 0 ? rawTinted : tinted[state.palette]; }

function draw() {

  const flip = state.dir === "right";
  sctx.clearRect(0, 0, stage.width, stage.height);

  for (const layer of HERO.order) {
    const idx = layerFrame(fr, layer);
    const pos = layerPos(layer, fr);
    if (state.visible[layer] && idx >= 0) {
      sctx.save();
      if (flip) { sctx.translate(pos.x + CW, pos.y); sctx.scale(-1, 1); } else { sctx.translate(pos.x, pos.y); }

      sctx.restore();

    if (showFrames && state.visible[layer]) {

      sctx.globalAlpha = 0.9;

      sctx.fillRect(pos.x + px - 2, pos.y + HERO.pivot[1], 5, 1);
      sctx.fillRect(pos.x + px, pos.y + HERO.pivot[1] - 2, 1, 5);
      sctx.globalAlpha = 1;

  $("frame").value = state.frame % frames.length;

  for (const layer of HERO.order) {
    const idx = layerFrame(fr, layer);
    $("n_" + layer).textContent = idx < 0 ? "скрыт в этом кадре" : `кадр ${idx + 1} из ${HERO.layers[layer].frames}`;
    drawStrip(layer, idx);

}

function drawStrip(layer, idx) {
  const c = stripCanvases[layer], ctx = c.getContext("2d");
  if (c.dataset.key === idx + ":" + state.palette) return;
  c.dataset.key = idx + ":" + state.palette;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.globalAlpha = 0.45;
  ctx.drawImage(strips()[layer], 0, 0);
  ctx.globalAlpha = 1;
  if (idx >= 0) {
    ctx.drawImage(strips()[layer], idx * CW, 0, CW, CH, idx * CW, 0, CW, CH);
    ctx.fillStyle = LAYER_COLORS[layer];
    ctx.fillRect(idx * CW, 0, CW, 1); ctx.fillRect(idx * CW, CH - 1, CW, 1);
    ctx.fillRect(idx * CW, 0, 1, CH); ctx.fillRect(idx * CW + CW - 1, 0, 1, CH);
    const box = c.parentElement, left = idx * CW * 2, right = left + CW * 2;

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (state.playing) {
    const frames = animFrames();
    clock += dt;
    let guard = 0;
    while (clock >= frames[state.frame % frames.length].t && guard++ < 20) {
      clock -= frames[state.frame % frames.length].t;
      state.frame = (state.frame + 1) % frames.length;
    }
    draw();
  }
  requestAnimationFrame(tick);

function fit() {
  const avail = $("stageBox").clientWidth;
  scale = Math.max(2, Math.min(6, Math.floor(avail / 140)));
  stage.width = Math.max(120, Math.min(220, Math.floor(avail / scale)));
  stage.height = 44 + CH + 12;
  stage.style.width = stage.width * scale + "px";
  stage.style.height = stage.height * scale + "px";
  draw();

function segment(box, items, get, set) {
  for (const [value, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.value = value;
    b.addEventListener("click", () => { set(value); refresh(box, get); draw(); });
    box.appendChild(b);
  }
  refresh(box, get);
}

function refresh(box, get) {
  for (const b of box.children) b.setAttribute("aria-pressed", String(b.dataset.value === String(get())));

  $("dirNote").textContent = state.dir === "right"

  if (state.frames || state.spread > 0) {
    for (const layer of [...HERO.order].reverse()) {
      if (!state.visible[layer]) continue;
      const pos = layerPos(layer, fr);
      if (p.x >= pos.x && p.y >= pos.y && p.x < pos.x + CW && p.y < pos.y + CH) return layer;
    }
  }
  return null;
}
stage.addEventListener("pointerdown", e => {
  const p = artPoint(e), layer = hit(p);
  if (!layer) return;
  drag = { layer, sx: p.x, sy: p.y, ox: state.offset[layer].x, oy: state.offset[layer].y };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const p = artPoint(e);
  state.offset[drag.layer].x = drag.ox + p.x - drag.sx;
  state.offset[drag.layer].y = drag.oy + p.y - drag.sy;
  draw();
});
for (const ev of ["pointerup", "pointercancel"]) stage.addEventListener(ev, () => { drag = null; stage.classList.remove("dragging"); });

async function start() {
  if (HERO.title) { $("title").textContent = HERO.title; document.title = HERO.title; }
  if (HERO.lead) $("lead").textContent = HERO.lead;
  let palData = null, sets = 0;
  if (HAS_PALETTES) {
    const pal = toCanvas(await loadImage(HERO.palettes));
    palData = pal.getContext("2d").getImageData(0, 0, pal.width, pal.height);
    sets = HERO.paletteNames.length;
  } else {
    $("palGroup").hidden = true;
  }
  tinted = Array.from({ length: sets }, () => ({}));
  for (const layer of HERO.order) {
    const c = toCanvas(await loadImage(HERO.layers[layer].png));
    raw[layer] = c.getContext("2d").getImageData(0, 0, c.width, c.height);
    rawTinted[layer] = c;
    for (let s = 0; s < sets; s++) tinted[s][layer] = recolor(c, palData, s);
  }

  segment($("dirs"), DIRS, () => state.dir, v => { state.dir = v; state.frame = 0; clock = 0; setNotes(); });
  segment($("anims"), ANIMS, () => state.anim, v => { state.anim = v; state.frame = 0; clock = 0; });
  if (HAS_PALETTES) {
    const palItems = HERO.paletteLabels.map((label, i) => [String(i), label]).concat([["-1", "Служебные цвета"]]);
    segment($("pals"), palItems, () => state.palette, v => { state.palette = Number(v); setNotes(); });
  }

  for (const layer of HERO.order) {
    const li = document.createElement("li");
    li.innerHTML = `<label for="v_${layer}"><input id="v_${layer}" type="checkbox" checked><span class="swatch" style="background:${LAYER_COLORS[layer]}"></span><span>${LAYER_NAMES[layer]}</span></label><span class="num" id="n_${layer}"></span><span class="note">${LAYER_NOTES[layer]}</span>`;
    $("layers").appendChild(li);
    li.querySelector("input").addEventListener("change", e => { state.visible[layer] = e.target.checked; draw(); });

    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="strip-head"><span class="strip-name">${LAYER_NAMES[layer]}</span><span class="num">${HERO.layers[layer].frames} кадров по ${CW}x${CH}</span><span class="note">${LAYER_NOTES[layer]}</span></div><div class="strip-scroll"></div>`;
    const c = document.createElement("canvas");
    c.width = HERO.layers[layer].frames * CW; c.height = CH;
    c.style.width = c.width * 2 + "px"; c.style.height = c.height * 2 + "px";
    wrap.querySelector(".strip-scroll").appendChild(c);
    stripCanvases[layer] = c;
    $("strips").appendChild(wrap);
  }

  $("play").addEventListener("click", () => { state.playing = !state.playing; $("play").textContent = state.playing ? "Пауза" : "Играть"; });
  $("play").textContent = state.playing ? "Пауза" : "Играть";
  $("frame").addEventListener("input", e => { state.frame = Number(e.target.value); state.playing = false; clock = 0; $("play").textContent = "Играть"; draw(); });
  $("spread").addEventListener("input", e => { state.spread = Number(e.target.value); $("spreadNum").textContent = state.spread + " px"; draw(); });
  $("frames").addEventListener("change", e => { state.frames = e.target.checked; draw(); });
  $("reset").addEventListener("click", () => {
    for (const l of HERO.order) { state.offset[l] = { x: 0, y: 0 }; state.visible[l] = true; $("v_" + l).checked = true; }
    state.spread = 0; $("spread").value = 0; $("spreadNum").textContent = "0 px"; draw();
  });
  setNotes();
  new ResizeObserver(fit).observe($("stageBox"));
  fit();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
}
start();
</script>
